site_name: Witch's Atelier Wiki
site_description: Player guide for Witch's Atelier, a Minecraft mod where spells are drawn as glyphs.
site_url: https://fimkov.github.io/witchsatelier-wiki/
repo_url: https://github.com/fimkov/witchsatelier-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.keys
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Glyphs: glyphs.md
  - Inks: inks.md
  - Artifacts: artifacts.md
  - Creatures: creatures.md
  - The Pact: pact.md
